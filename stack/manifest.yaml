# Version pin documentation (the authoritative pin is the upstream/ submodule gitlink; do not edit this file by hand)
version: 1

upstream:
  tt-inference-server:
    url: https://github.com/tenstorrent/tt-inference-server.git
    ref: 0da24a9debc2f3a01046cbee674fa83f91f4902e   # was v0.22.0 (tag points elsewhere)
    commit: 0da24a9debc2f3a01046cbee674fa83f91f4902e
    role: deployment/workflow framework, provides the official Dockerfile, the app entry point and model_spec.json
  tt-metal:
    url: https://github.com/tenstorrent/tt-metal.git
    ref: v0.79.0-rc11
    commit: 29f93c914b6137d22571a6c99df912f359739b54
    role: TT-Metalium / TT-NN core (C++ and Python bindings, SFPI integration)
  vllm-tt-plugin:
    url: https://github.com/tenstorrent/vllm-tt-plugin.git
    ref: d84049e   # main
    commit: d84049edcece77c64772a39e92f920f5679efce4
    role: vLLM platform plugin (pins vllm==0.30.0 internally)
  sfpi:
    url: https://github.com/tenstorrent/sfpi.git
    ref: fe971db51e0d67036109a6e57a0ea54524c9c63e   # was 7.78.0 (tag points elsewhere)
    commit: fe971db51e0d67036109a6e57a0ea54524c9c63e
    role: riscv-tt-elf cross toolchain sources (binutils/gcc/newlib submodules)
  tt-smi:
    url: https://github.com/tenstorrent/tt-smi.git
    ref: v3.1.1
    commit: a2791bfec3324f4cb72a362b413460b89ca2b391
    role: chip status monitor (separate venv)

images:                       # riscv64 only (patches/riscv64 layer)
  base_os: ubuntu:26.04       # Official riscv64 image (native linux/riscv64): the base stage uses it as FROM,
                              #   -> no debootstrap, no host root
  base: local/tt-metal/tt-metalium/ubuntu-26.04-riscv64:v1
  rootfs: local/ubuntu:26.04-riscv64   # used only with USE_DEBOOTSTRAP=1 (faithful in-container debootstrap path)
  # Naming rule: rvocs-vllm-tt-<arch>:<repository version> (arch = amd64/arm64/riscv64)
  main: rvocs-vllm-tt-<arch>:<version>          # e.g. rvocs-vllm-tt-riscv64:v0.1.0

submodules:
  # Nested submodules required for the build (missing ones are fatal; the sfpi ones only matter for a source build)
  required:
    upstream/sfpi: [binutils, gcc, newlib]
  # Nested submodules irrelevant to the image build that always fail here (01-fetch marks them update=none)
  #   Mooncake uses an SSH URL and tt-llm-engine asks for interactive auth through gh-proxy; both live under tt-media-server.
  ignored:
    upstream/tt-inference-server:
      - tt-media-server/cpp_server/third_party/Mooncake
      - tt-media-server/cpp_server/tt-llm-engine

sfpi_prebuilt:                # riscv64 only; built from the sfpi 7.78.0 sources on a riscv64 host
  path: assets/riscv64/sfpi-prebuilt/sfpi_7.78.0_riscv64_debian.txz
  sha256: 0214513ea1ceafc2f1abdef352d66ccf3efd9fe08ef806e6ff614644050acc0b
  size_bytes: 77142200
  host_requirements:
    arch: riscv64
    glibc: ">=2.38"           # highest glibc symbol version referenced by the binaries
    os_family: debian        # sfpi-info.sh decides via ID_LIKE (both Ubuntu and Debian match)
  verified: "workdir pre-flight: file name match + sha256 + executable smoke build (-mcpu=tt-bh -mabi=ilp32)"
  fallback: "--no-sfpi-prebuilt, or a failed pre-flight, builds it from source in the container (~90 minutes)"

python:
  version: "3.12"             # uv-managed cpython 3.12.15; riscv64 wheels are cp312 only
  torch: 2.14.0+cpu           # RISE riscv64 wheel (assets/riscv64/wheelhouse.sha256)
  numpy: 2.5.3
  pandas: 2.3.3
  matplotlib: 3.11.1
  pillow: 12.3.0

patches:                      # per-arch patch layers (single branch)
  dir: patches/riscv64
  series:
    tt-metal:
      - 1001-add-riscv64-clang20-toolchain-file.patch
      - 1002-build-metal-use-riscv64-toolchain.patch
      - 1003-sfpi-prestaged-source-skip-dejagnu.patch
      - 1004-cpm-offline-bootstrap.patch
      - 1005-streaming-profiler-simde.patch
      - 1006-python-env-riscv64-deps.patch
      - 1007-create-venv-riscv64.patch
    vllm-tt-plugin:
      - 2001-install-vllm-tt-riscv64.patch
      - 2002-vllm-overrides-riscv64.patch

notes: |
  - Patches must apply with git apply semantics in series order (CI runs apply --check against the pinned submodules).
  - torch/numpy and friends come from the RISE index (https://pypi.riseproject.dev), downloaded through a mirror;
    sha256 values are in assets/riscv64/wheelhouse.sha256.
  - SFPI: the bundled assets/riscv64/sfpi-prebuilt/ package is used by default (only after the pre-flight check); --no-sfpi-prebuilt builds it from source.
  - tt-metal's CMake only checks that the SFPI package file exists (hw/CMakeLists.txt) and does no ABI check,
    so the build scripts run their own arch/glibc/smoke pre-flight before using it.
